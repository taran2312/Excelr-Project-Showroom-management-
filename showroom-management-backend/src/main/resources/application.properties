spring.application.name=showroom-management-backend
server.port=8080

# ---------- MySQL ----------
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/showroom_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Base64-encoded HMAC-SHA key (>= 256 bits). Development default only:
# set JWT_SECRET in any shared or production environment.
app.jwt.secret=${JWT_SECRET:wtBKz1tndgvK2TsogXRiyUs2sfVxOjaOETxpI0l5tQoURqV1wt6knDIyTTDH/cCQkZJWCxhESv6SPkFWxTvTNQ==}
# 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Seed admin (created only when the users table is empty) ----------
app.seed.admin-email=${ADMIN_EMAIL:admin@showroom.com}
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
